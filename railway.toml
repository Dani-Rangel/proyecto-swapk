[build]
builder = "NODE"

[[services]]
name = "swapk-frontend"
build = { root = "frontend", command = "npm install && npm run build --no-lint" }
start = "cd .next/standalone && node server.js --port 8080"
working_directory = "frontend"
env = { 
  NODE_ENV = "production",
  PORT = "3000",
  VITE_API_BASE = "https://swapk-backend-production.up.railway.app"
}
resources = { cpu = "500m", memory = "1024Mi" }  # ✅ 1GB RAM — IMPRESCINDIBLE

[[services]]
name = "swapk-backend"
build = { root = "backend", command = "pip install -r requirements.txt" }
start = "uvicorn main:app --host 0.0.0.0 --port $PORT"
working_directory = "backend"
env = {
  PYTHONUNBUFFERED = "1",
  RAILWAY_ENVIRONMENT = "production",
  MYSQLHOST = "mysql.railway.internal",
  MYSQLUSER = "root",
  MYSQLPASSWORD = "dvKqHQaXILWfqTpClbgbMvXUhOdXLEfn",
  MYSQLDATABASE = "railway",
  MYSQLPORT = "3306"
}
# resources = { cpu = "500m", memory = "512Mi" }  # ❌ Deja backend en 512MB si solo tienes 1GB total (gratis)
