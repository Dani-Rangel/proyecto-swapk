# railway.toml

# Frontend (Next.js)
[[services]]
name = "frontend"
build = { root = "frontend", command = "npm install && npm run build" }
start = "npm start"

# Backend (FastAPI/Python)
[[services]]
name = "backend"
build = { root = "backend", command = "pip install -r requirements.txt" }
start = "uvicorn main:app --host 0.0.0.0 --port $PORT"
