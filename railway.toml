[build]
builder = "NIXPACKS"

[[services]]
name = "swapk-frontend"
build = { root = "frontend", command = "npm install && npm run build --no-lint" }
start = "npm start"
working_directory = "frontend"
env = { 
  NODE_ENV = "production", 
  PORT = "3000" 
}
resources = { cpu = "500m", memory = "1024Mi" }

[[services]]
name = "swapk-backend"
build = { root = "backend", command = "pip install -r requirements.txt" }
start = "uvicorn main:app --host 0.0.0.0 --port $PORT"
working_directory = "backend"
env = { 
  PYTHONUNBUFFERED = "1",
  RAILWAY_ENVIRONMENT = "production",
  MYSQLHOST = "mysql.railway.internal",      # ✅ Host correcto
  MYSQLUSER = "root",                        # ✅ Usuario
  MYSQLPASSWORD = "dvKqHQaXILWfqTpClbgbMvXUhOdXLEfn",  # ✅ Contraseña
  MYSQLDATABASE = "railway",                 # ✅ Base de datos
  MYSQLPORT = "3306"                         # ✅ Puerto
}
resources = { cpu = "500m", memory = "1024Mi" }
